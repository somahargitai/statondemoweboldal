services:
  postgres:
    image: postgres:16-alpine
    container_name: staton-web-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: staton
      POSTGRES_PASSWORD: staton
      POSTGRES_DB: staton_web
    ports:
      - "5433:5432"
    volumes:
      - staton_web_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staton -d staton_web"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  staton_web_pgdata:
